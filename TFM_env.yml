name: TFM_env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12.6
  - pip

  # Core scientific stack
  - numpy=2.4.4
  - pandas=2.3.3
  - scipy=1.17.1

  # Machine learning
  - scikit-learn=1.7.2

  # Visualisation
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - graphviz=0.21

  # Jupyter
  - jupyter
  - ipykernel=6.29.5

  # pip-only packages
  - pip:
    - tda-mapper==0.12.0
